site_name: argocd-ai-assistant
repo_url: https://github.com/saidsef/argocd-ai-assistant
strict: true
theme:
  name: material
  palette:
    primary: teal
  features:
  - content.code.copy
markdown_extensions:
- codehilite
- admonition
- tables
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: readme.md
  - Architecture: architecture.md
  - Providers:
    - LLM: providers/llm.md
  - Deployment:
    - Overview: deployment.md
    - Argo CD Operator: deployment/operator.md
    - Helm Chart: deployment/helm.md
    - Raw Manifests: deployment/raw.md
    - Settings Extension: deployment/settings.md
    - Proxy & Backend: deployment/proxy.md
    - Local Testing (kind): deployment/local-testing.md
    - Verification & Troubleshooting: deployment/verification.md
