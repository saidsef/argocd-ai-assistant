name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build extension
        run: yarn run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: dist/

      - name: Package extension for PR testing
        if: github.event_name == 'pull_request'
        run: tar -C dist -cvf dist/extension-argocd-ai-assistant-pr-${{ github.event.pull_request.number }}.tar resources

      - name: Upload PR tar artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: extension-pr-${{ github.event.pull_request.number }}
          path: dist/extension-argocd-ai-assistant-pr-${{ github.event.pull_request.number }}.tar
          retention-days: 3
