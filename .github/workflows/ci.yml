name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build extension
        run: yarn run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: dist/

      - name: Package extension for PR testing
        if: github.event_name == 'pull_request'
        run: tar -C dist -cvf dist/extension-argocd-ai-assistant-pr-${{ github.event.pull_request.number }}.tar resources

      - name: Publish PR pre-release
        if: github.event_name == 'pull_request'
        run: |
          gh release delete pr-${{ github.event.pull_request.number }} --cleanup-tag --yes 2>/dev/null || true
          gh release create pr-${{ github.event.pull_request.number }} \
            dist/extension-argocd-ai-assistant-pr-${{ github.event.pull_request.number }}.tar \
            --title "PR #${{ github.event.pull_request.number }} test build" \
            --notes "Temporary pre-release for testing PR #${{ github.event.pull_request.number }}. Auto-deleted 3 days after creation or on PR close." \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
