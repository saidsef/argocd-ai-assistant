# Optional kind config: exposes host port 30443 (e.g. a NodePort to the UI).
# setup.sh does not use it - reach the UI with `kubectl port-forward` instead.
#   kind create cluster --config examples/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
