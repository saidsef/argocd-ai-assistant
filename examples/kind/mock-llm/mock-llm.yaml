# Mock OpenAI-compatible LLM for local testing: streams a canned SSE chat
# completion and echoes the Authorization header it receives. Deterministic, no
# GPU/key. Swap the proxy `services[].url` for a real backend in production.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-llm
  labels:
    app: mock-llm
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    REPLY = ("Hello from the mock LLM. The Argo CD AI Assistant proxy path is "
             "working end to end.").split(" ")


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _headers(self, code, ctype, extra=None):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            for k, v in (extra or {}).items():
                self.send_header(k, v)
            self.end_headers()

        def do_GET(self):
            if self.path.rstrip("/").endswith("/v1/models"):
                body = json.dumps({
                    "object": "list",
                    "data": [{"id": "mock-model", "object": "model", "owned_by": "mock"}],
                }).encode()
                self._headers(200, "application/json", {"Content-Length": str(len(body))})
                self.wfile.write(body)
            else:
                body = b"mock-llm ok\n"
                self._headers(200, "text/plain", {"Content-Length": str(len(body))})
                self.wfile.write(body)

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0) or 0)
            if length:
                self.rfile.read(length)
            # Echo the proxy-injected Authorization header back to the caller.
            auth = self.headers.get("Authorization", "<none>")
            self._headers(200, "text/event-stream", {
                "Cache-Control": "no-cache",
                "Connection": "close",
            })

            def chunk(delta, finish=None):
                payload = {
                    "id": "chatcmpl-mock",
                    "object": "chat.completion.chunk",
                    "model": "mock-model",
                    "choices": [{"index": 0, "delta": delta, "finish_reason": finish}],
                }
                self.wfile.write(("data: " + json.dumps(payload) + "\n\n").encode())
                self.wfile.flush()

            chunk({"role": "assistant"})
            chunk({"content": "[received-authorization: " + auth + "] "})
            for i, word in enumerate(REPLY):
                chunk({"content": (" " if i else "") + word})
            chunk({}, finish="stop")
            self.wfile.write(b"data: [DONE]\n\n")
            self.wfile.flush()

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  labels:
    app: mock-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm
  template:
    metadata:
      labels:
        app: mock-llm
    spec:
      containers:
        - name: mock-llm
          image: python:3.12-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
      volumes:
        - name: app
          configMap:
            name: mock-llm
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  labels:
    app: mock-llm
spec:
  selector:
    app: mock-llm
  ports:
    - port: 8000
      targetPort: 8000
