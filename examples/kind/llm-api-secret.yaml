# Dedicated, labeled Secret holding the LLM API token, referenced from the proxy
# header as '$argocd-ai-assistant-secret:openai-api-key'. The
# app.kubernetes.io/part-of: argocd label is what lets Argo CD load it for
# $secret:key substitution. In production populate it from a secret manager
# (External Secrets / Sealed Secrets / SOPS) - never a literal like below.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-ai-assistant-secret
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  openai-api-key: "Bearer kind-ci-injected-token"   # CI/TEST only - fake token
