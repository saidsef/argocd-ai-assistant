<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" role="img" aria-labelledby="svgtitle svgdesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="svgtitle">Assistant for Argo CD architecture</title>
  <desc id="svgdesc">The Assistant tab runs in the browser inside the Argo CD UI. The argocd-server pod serves the extension bundle and its settings ConfigMap, and answers same-origin Argo CD API calls for manifests, events, pod logs and the Application summary. Chat requests carry that context to an OpenAI-compatible LLM backend through the proxy extension at /extensions/assistant, which authorises every request against an Application using the Argocd-Application-Name and Argocd-Project-Name headers, and streams the answer back over SSE. MCP servers are the exception: the browser calls them directly rather than through the proxy, so each one must send CORS headers for the Argo CD origin.</desc>

  <!-- The light palette is set with presentation attributes so the diagram still renders
       if a strict CSP drops this block. Dark mode overrides only the colours. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .box     { fill: #161b22; stroke: #4b535d; }
      .boxdash { stroke: #768390; }
      .div     { stroke: #30363d; }
      .edge    { stroke: #768390; }
      .ah      { fill: #768390; }
      .t       { fill: #e6edf3; }
      .l       { fill: #c9d1d9; }
      .s       { fill: #9198a1; }
      .ic      { stroke: #c9d1d9; }
      .icf     { fill: #c9d1d9; }
      .eye     { fill: #161b22; }
      .o-s     { stroke: #f0883e; }
      .o-f     { fill: #f0883e; }
      .b-s     { stroke: #58a6ff; }
      .b-f     { fill: #58a6ff; }
    }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" fill="#6e7781" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arw-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="b-f" fill="#0969da" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="arw-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="o-f" fill="#bc4c00" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- ===================== Browser ===================== -->
  <rect class="box" x="220" y="24" width="400" height="190" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <g class="ic" transform="translate(244,40)" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2.75" width="18" height="14.5" rx="2.5"/>
    <path d="M1 7.4 H19"/>
    <rect x="3.6" y="4.1" width="12.8" height="2.2" rx="1.1"/>
  </g>
  <text class="t" x="276" y="56" fill="#1f2328" font-size="16" font-weight="600">Browser</text>
  <text class="s" x="604" y="56" text-anchor="end" fill="#656d76" font-size="12">the Argo CD origin</text>
  <path class="div" d="M236 72 H604" stroke="#d0d7de" stroke-width="1"/>

  <g transform="translate(246,87)">
    <path class="icf" d="M5 15a7 7 0 0 1 14 0z" fill="#1f2328" transform="scale(0.833)"/>
    <g class="ic" fill="none" stroke="#1f2328" stroke-width="1.9" stroke-linecap="round" transform="scale(0.833)">
      <path d="M6.2 15c0 2.2-.9 3.5-2.4 4.5"/><path d="M9.1 15c0 2.7-.4 4.3-1 5.7"/>
      <path d="M12 15v5.9"/><path d="M14.9 15c0 2.7.4 4.3 1 5.7"/><path d="M17.8 15c0 2.2.9 3.5 2.4 4.5"/>
    </g>
    <g class="eye" fill="#ffffff" transform="scale(0.833)">
      <circle cx="9.8" cy="11.9" r="1.3"/><circle cx="14.2" cy="11.9" r="1.3"/>
    </g>
  </g>
  <text class="l" x="272" y="99" fill="#24292f" font-size="13">Argo CD UI</text>
  <text class="s" x="272" y="115" fill="#656d76" font-size="11.5">the resource slide-out, and the Assistant tab on it</text>

  <g class="ic" transform="translate(246,127)" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 5.4A2.1 2.1 0 0 1 4.6 3.3h10.8a2.1 2.1 0 0 1 2.1 2.1v6.7a2.1 2.1 0 0 1-2.1 2.1H8.3l-3.7 2.8v-2.8h-.1a2.1 2.1 0 0 1-2-2.1Z"/>
    <path d="M6.2 7.3h7.5"/><path d="M6.2 10.3h4.6"/>
  </g>
  <text class="l" x="272" y="139" fill="#24292f" font-size="13">Assistant tab</text>
  <text class="s" x="272" y="155" fill="#656d76" font-size="11.5">React chat UI, assembles the context, streams the answer</text>

  <g class="ic" transform="translate(246,167)" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.7 2v3.7"/><path d="M12.3 2v3.7"/>
    <path d="M4.8 5.8h10.4v3a5.2 5.2 0 0 1-10.4 0Z"/>
    <path d="M10 14v4"/>
  </g>
  <text class="l" x="272" y="179" fill="#24292f" font-size="13">MCP client</text>
  <text class="s" x="272" y="195" fill="#656d76" font-size="11.5">JSON-RPC, Bearer token held in sessionStorage</text>

  <!-- ===================== Browser to pod ===================== -->
  <path class="edge" d="M270 294 V218" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arw)"/>
  <text class="l" x="262" y="243" text-anchor="end" fill="#24292f" font-size="12">loads bundle</text>
  <text class="s" x="262" y="259" text-anchor="end" fill="#656d76" font-size="11.5">at startup</text>

  <path class="edge" d="M400 216 V292" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arw)"/>
  <text class="l" x="410" y="243" fill="#24292f" font-size="12">fetch context</text>
  <text class="s" x="410" y="259" fill="#656d76" font-size="11.5">same origin</text>

  <path class="b-s" d="M560 216 V292" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arw-b)"/>
  <text class="l" x="570" y="243" fill="#24292f" font-size="12" font-weight="600">chat + context</text>
  <text class="s" x="570" y="259" fill="#656d76" font-size="11.5">SSE response</text>

  <!-- ===================== argocd-server pod ===================== -->
  <rect class="box" x="220" y="296" width="400" height="204" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3"/>
  <g class="ic" transform="translate(244,312)" fill="none" stroke="#1f2328" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="10,2.1 16.2,5.1 17.7,11.8 13.4,17.1 6.6,17.1 2.3,11.8 3.8,5.1"/>
    <circle cx="10" cy="10" r="2.2"/>
    <path d="M10 7.8V4.6"/><path d="M11.7 8.6 14.2 6.6"/><path d="M12.1 10.5 15.3 11.2"/>
    <path d="M10.9 11.9 12.3 14.9"/><path d="M9.1 11.9 7.7 14.9"/>
    <path d="M7.9 10.5 4.7 11.2"/><path d="M8.3 8.6 5.8 6.6"/>
  </g>
  <text class="t" x="276" y="328" fill="#1f2328" font-size="16" font-weight="600">argocd-server pod</text>
  <path class="div" d="M236 344 H604" stroke="#d0d7de" stroke-width="1"/>

  <g class="ic" transform="translate(246,359)" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.4 2.1H12.5L15.8 5.4V16.7a1.3 1.3 0 0 1-1.3 1.3H5.4a1.3 1.3 0 0 1-1.3-1.3V3.4a1.3 1.3 0 0 1 1.3-1.3Z"/>
    <path d="M12.5 2.1v3.3h3.3"/><path d="M6.8 9.6h6.3"/><path d="M6.8 12.5h6.3"/><path d="M6.8 15.4h4"/>
  </g>
  <text class="l" x="272" y="371" fill="#24292f" font-size="13">Extension resources</text>
  <text class="s" x="272" y="387" fill="#656d76" font-size="11.5">/tmp/extensions/resources/ - bundle + ConfigMap</text>

  <g class="ic" transform="translate(246,399)" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 3.3c-2.5 0-1.8 5-4.2 6.7 2.4 1.7 1.7 6.7 4.2 6.7"/>
    <path d="M12.5 3.3c2.5 0 1.8 5 4.2 6.7-2.4 1.7-1.7 6.7-4.2 6.7"/>
    <circle class="icf" cx="10" cy="10" r="0.85" fill="#1f2328" stroke="none"/>
  </g>
  <text class="l" x="272" y="411" fill="#24292f" font-size="13">Argo CD API</text>
  <text class="s" x="272" y="427" fill="#656d76" font-size="11.5">manifests, events, pod logs, Application summary</text>

  <g class="b-s" transform="translate(246,439)" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2.1v15.8" stroke-dasharray="2.2 2.2"/>
    <path d="M2.5 7.1h10.8"/><polygon class="b-f" points="16.7,7.1 12.9,5.3 12.9,8.9" fill="#0969da" stroke="none"/>
    <path d="M17.5 12.9H6.7"/><polygon class="b-f" points="3.3,12.9 7.1,11.1 7.1,14.7" fill="#0969da" stroke="none"/>
  </g>
  <text class="l" x="272" y="451" fill="#24292f" font-size="13">Proxy extension</text>
  <text class="s" x="272" y="467" fill="#656d76" font-size="11.5">/extensions/assistant - authorises per Application</text>
  <text class="s" x="272" y="484" fill="#656d76" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Argocd-Application-Name + Argocd-Project-Name</text>

  <!-- ===================== Pod to LLM ===================== -->
  <path class="b-s" d="M420 502 V576" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arw-b)"/>
  <text class="l" x="430" y="528" fill="#24292f" font-size="12" font-weight="600">chat completions</text>
  <text class="s" x="430" y="544" fill="#656d76" font-size="11.5">SSE response</text>

  <!-- ===================== LLM backend ===================== -->
  <rect class="box boxdash" x="220" y="578" width="400" height="130" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="5 4"/>
  <g class="ic" transform="translate(244,594)" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.2" y="4.2" width="11.6" height="11.6" rx="2.1"/><rect x="7.7" y="7.7" width="4.6" height="4.6" rx="1"/>
    <path d="M7.5 4.2V1.8"/><path d="M10 4.2V1.8"/><path d="M12.5 4.2V1.8"/>
    <path d="M7.5 15.8v2.4"/><path d="M10 15.8v2.4"/><path d="M12.5 15.8v2.4"/>
    <path d="M4.2 7.5H1.8"/><path d="M4.2 10H1.8"/><path d="M4.2 12.5H1.8"/>
    <path d="M15.8 7.5h2.4"/><path d="M15.8 10h2.4"/><path d="M15.8 12.5h2.4"/>
  </g>
  <text class="t" x="276" y="610" fill="#1f2328" font-size="16" font-weight="600">LLM backend</text>
  <text class="s" x="604" y="610" text-anchor="end" fill="#656d76" font-size="12">OpenAI-compatible</text>
  <path class="div" d="M236 626 H604" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="236" y="648" fill="#656d76" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/v1/chat/completions</text>
  <text class="l" x="236" y="670" fill="#24292f" font-size="12">vLLM, Ollama, OpenAI, Azure OpenAI, DeepSeek, or any</text>
  <text class="l" x="236" y="690" fill="#24292f" font-size="12">server that speaks the chat completions API</text>

  <!-- ===================== MCP servers ===================== -->
  <path class="o-s" d="M622 179 H650 q16 0 16 16 V372 q0 16 16 16 H686" fill="none" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#arw-o)"/>
  <text class="l" x="690" y="240" fill="#24292f" font-size="12" font-weight="600">direct from the browser</text>
  <text class="s" x="690" y="258" fill="#656d76" font-size="11.5">never through the proxy extension</text>

  <rect class="box boxdash o-s" x="690" y="300" width="290" height="176" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="5 4"/>
  <g class="o-s" transform="translate(714,316)" fill="none" stroke="#bc4c00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.7 2v3.7"/><path d="M12.3 2v3.7"/>
    <path d="M4.8 5.8h10.4v3a5.2 5.2 0 0 1-10.4 0Z"/>
    <path d="M10 14v4"/>
  </g>
  <text class="t" x="746" y="332" fill="#1f2328" font-size="16" font-weight="600">MCP servers</text>
  <path class="div" d="M706 348 H964" stroke="#d0d7de" stroke-width="1"/>
  <text class="l" x="706" y="370" fill="#24292f" font-size="12">HTTP-streamable JSON-RPC</text>
  <text class="s" x="706" y="390" fill="#656d76" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Authorization: Bearer &lt;token&gt;</text>
  <text class="l" x="706" y="414" fill="#24292f" font-size="11.5">the browser calls these itself,</text>
  <text class="l" x="706" y="432" fill="#24292f" font-size="11.5">so each must send CORS headers</text>
  <text class="l" x="706" y="450" fill="#24292f" font-size="11.5">for the Argo CD origin</text>

  <text class="s" x="20" y="742" fill="#656d76" font-size="11.5">A dashed border marks a service outside the argocd-server pod. Blue is the LLM path the proxy extension carries, orange the MCP path the browser makes itself.</text>
</svg>
